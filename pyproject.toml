[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "2gis-lead"
version = "0.2.0"
description = "CLI scraper for 2GIS B2B listings and contact details"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "selenium>=4.15.0",
    "questionary>=2.0.1",
    "rich>=13.7.0"
]

[project.scripts]
2gis = "main:main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
where = ["."]
include = ["executor*", "runner*", "io_handler*", "utils*"]
exclude = ["data*"]
