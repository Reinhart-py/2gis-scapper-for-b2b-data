name: Build Executable

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pillow

      - name: Generate Application Icon
        shell: pwsh
        run: |
          python -c "from PIL import Image; img = Image.open('images/logo1.png'); img.save('images/icon.ico', format='ICO', sizes=[(256, 256), (128, 128), (64, 64), (32, 32), (16, 16)])"

      - name: Compile Executable with PyInstaller
        shell: pwsh
        run: |
          pyinstaller --noconfirm --onefile --console `
            --name "2GIS_Scraper" `
            --icon "images/icon.ico" `
            --add-data "images;images" `
            --collect-all questionary `
            --collect-all rich `
            main.py

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: 2GIS_Scraper_Windows
          path: dist/2GIS_Scraper.exe
