name: Build Cross-Platform Executables

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: lead_Windows.exe
            output_binary: dist/2GIS_Scraper.exe
            sep: ";"
          - os: ubuntu-latest
            artifact_name: lead_Linux
            output_binary: dist/2GIS_Scraper
            sep: ":"
          - os: macos-latest
            artifact_name: lead_macOS
            output_binary: dist/2GIS_Scraper
            sep: ":"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pillow

      - name: Generate Icon (Windows Only)
        if: runner.os == 'Windows'
        run: |
          python -c "from PIL import Image; img = Image.open('images/logo1.png'); img.save('images/icon.ico', format='ICO', sizes=[(256, 256), (128, 128), (64, 64), (32, 32), (16, 16)])"

      # Windows Build Step
      - name: Compile Windows Executable
        if: runner.os == 'Windows'
        run: |
          pyinstaller --noconfirm --onefile --console `
            --name "2GIS_Scraper" `
            --icon "images/icon.ico" `
            --add-data "images${{ matrix.sep }}images" `
            --collect-all questionary `
            --collect-all rich `
            main.py

      # Linux & macOS Build Step
      - name: Compile Linux/macOS Executable
        if: runner.os != 'Windows'
        run: |
          pyinstaller --noconfirm --onefile --console \
            --name "2GIS_Scraper" \
            --add-data "images${{ matrix.sep }}images" \
            --collect-all questionary \
            --collect-all rich \
            main.py

      - name: Rename Output Binary
        shell: bash
        run: |
          mkdir -p artifacts
          cp ${{ matrix.output_binary }} artifacts/${{ matrix.artifact_name }}

      - name: Upload Single OS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: artifacts/${{ matrix.artifact_name }}

  release:
    name: Publish All Binaries to GitHub Releases
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download Windows Binary
        uses: actions/download-artifact@v4
        with:
          name: 2GIS_Scraper_Windows.exe
          path: release_assets

      - name: Download Linux Binary
        uses: actions/download-artifact@v4
        with:
          name: 2GIS_Scraper_Linux
          path: release_assets

      - name: Download macOS Binary
        uses: actions/download-artifact@v4
        with:
          name: 2GIS_Scraper_macOS
          path: release_assets

      - name: Publish Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: release_assets/*
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
